<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">{{ end }}
  {{ with resources.Get "css/style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
  {{ end }}
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
  <nav>
    <a href="{{ (site.GetPage "about").RelPermalink }}">About</a>
    <a href="{{ (site.Home.OutputFormats.Get "rss").RelPermalink }}">RSS</a>
  </nav>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
  <p>{{ site.Params.author }} · {{ now.Year }}</p>
</footer>
</body>
</html>
